<style>
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px)}
/* Layout: sidebar + single column on desktop, bottom tab bar on phone. One ink-dark hero card draws the eye; blue = action, orange = deadline, red = late. */
:root{
  --bg:#F3F4F6; --card:#FFFFFF; --ink:#0F172A; --muted:#475569; --line:#D5D9E0; --we:#E5E7EB;
  --accent:#1D4ED8; --on-accent:#FFFFFF;
  --warn:#C2410C; --on-warn:#FFFFFF; --late:#B91C1C;
  --hero:#0F172A; --on-hero:#FFFFFF; --hero-sub:#CBD5E1; --hero-warn:#FB923C;
  --font:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1020; --card:#131A2B; --ink:#E8ECF5; --muted:#A3AEC2; --line:#27324A; --we:#1A2338;
  --accent:#3B6BF5; --on-accent:#FFFFFF; --warn:#FB923C; --on-warn:#0B1020; --late:#C23A3A;
  --hero:#1E2A44; --on-hero:#FFFFFF; --hero-sub:#B8C3D9; --hero-warn:#FDBA74; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1020; --card:#131A2B; --ink:#E8ECF5; --muted:#A3AEC2; --line:#27324A; --we:#1A2338;
  --accent:#3B6BF5; --on-accent:#FFFFFF; --warn:#FB923C; --on-warn:#0B1020; --late:#C23A3A;
  --hero:#1E2A44; --on-hero:#FFFFFF; --hero-sub:#B8C3D9; --hero-warn:#FDBA74; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-text-size-adjust:100%}
body{padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1{margin:0;font-size:32px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
h2{margin:0;font-size:17px;font-weight:700}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);gap:0 8px;min-height:100vh;max-width:1180px;margin:0 auto}
.side{position:sticky;top:0;align-self:start;height:100vh;padding:32px 12px 24px 0;display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--line)}
.side a{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:12px;font-weight:500;color:var(--muted)}
.side a.on{background:var(--ink);color:var(--bg);font-weight:700}
.side .drop{margin-top:18px;min-height:48px;border-radius:99px;background:var(--accent);color:var(--on-accent);font-weight:700;justify-content:center}
.side .box{font-weight:600;color:var(--accent)}
.sync{margin-top:auto;font-size:13px;color:var(--muted);padding:0 12px}
main{min-width:0;padding:36px 0 60px 32px;max-width:900px;width:100%}
.tabbar{display:none}
@media (max-width:819px){
  .app{display:block}
  .side{display:none}
  main{padding:32px 0 130px}
  .tabbar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center;position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--card);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .tabbar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:48px;font-size:12px;font-weight:500;color:var(--muted)}
  .tabbar a.on{color:var(--accent);font-weight:700}
  .tabbar .plus span{width:52px;height:52px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center}
}
.stack{display:flex;flex-direction:column;gap:14px;margin-top:24px}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.seg{display:inline-flex;gap:4px;padding:3px;border-radius:99px;background:var(--we)}
.seg button{height:44px;padding:0 24px;border:0;border-radius:99px;background:transparent;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--ink);color:var(--bg);font-weight:700}
.pill{height:44px;padding:0 20px;border-radius:99px;border:1.5px solid var(--line);background:transparent;font-weight:600;color:var(--muted)}
.pill.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.btn{min-height:48px;padding:0 26px;border:0;border-radius:99px;font-weight:700;font-size:16px;background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent;border:2px solid var(--accent);color:var(--accent);min-height:44px;padding:0 20px;font-size:15px}
.btn.quiet{background:transparent;border:2px solid var(--muted);color:var(--muted);min-height:44px;padding:0 20px;font-size:15px}
.btn.light{background:#fff;color:#0F172A}
.btn.danger{background:var(--late);color:#fff}
.btn.dashed{background:transparent;border:1.5px dashed var(--muted);color:var(--muted);min-height:48px;font-size:15px;font-weight:600;width:100%;border-radius:18px}
.icon{width:44px;height:44px;border:0;background:transparent;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);flex:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 12px 14px 20px;display:flex;align-items:center;gap:8px}
.card .t{flex:1;min-width:0;font-size:20px;font-weight:600;overflow-wrap:anywhere}
.card.opt{background:transparent;border:1.5px dashed var(--muted)}
.card[data-hold]{-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
.asap{background:#C2410C;border-color:#C2410C;color:#fff}
.asap small{display:block;font-size:13px;font-weight:700;letter-spacing:.05em}
.asap .t{font-weight:700;font-size:22px}
.asap .icon{color:#fff}
.hero{background:var(--hero);color:var(--on-hero);border-radius:22px;padding:20px 22px 22px;display:flex;flex-direction:column;gap:12px}
.hero.late{background:var(--late)}
.hero .sub{font-size:15px;font-weight:500;color:var(--hero-sub);background:none;border:0;padding:0;text-align:left;min-height:32px}
.hero.late .sub{color:#FEE2E2}
.hero .big{font-size:28px;line-height:1.15;font-weight:700;letter-spacing:-.01em;overflow-wrap:anywhere}
.hero .foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:4px}
.hero .when{font-size:17px;font-weight:700;color:var(--hero-warn)}
.hero.late .when{color:#fff}
.list{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:56px;padding:0 8px 0 16px;border-bottom:1px solid var(--we);font-weight:500;width:100%;text-align:left;background:none;border-left:0;border-right:0;border-top:0;font-size:16px}
.row:last-child{border-bottom:0}
.row .dl{font-size:15px;font-weight:700;color:var(--warn);white-space:nowrap}
.row .dl.late{color:var(--late)}
.row[data-hold]{-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
.row.asap{background:#C2410C;color:#fff;border-radius:0}
.circle{width:26px;height:26px;border-radius:50%;border:2px solid var(--muted);flex:none}
.asap .circle{border-color:#fff}
.proj{display:flex;flex-direction:column;gap:12px;text-align:left;width:100%;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px}
.proj .l{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:19px;font-weight:700}
.proj .dl{font-size:15px;font-weight:700;color:var(--warn);white-space:nowrap}
.proj .dl.late{color:var(--late)}
.bar{display:flex;gap:4px}.bar i{flex:1;height:6px;border-radius:3px;background:var(--line)}.bar i.d{background:var(--accent)}
.sec{display:flex;flex-direction:column;gap:8px;margin-top:26px}
.strips{display:flex;flex-direction:column;gap:12px}
.srow{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center}
.srow .n{flex:0 0 180px;font-size:19px;font-weight:700;overflow-wrap:anywhere}
.srow .strip{flex:1 1 320px;min-width:0}
.strip{display:flex;gap:3px;overflow-x:auto;padding-bottom:4px}
.c{width:32px;flex:none;display:flex;flex-direction:column;gap:2px}
.c.w{width:42px}
.c .mo{height:14px;font:700 11px/14px var(--font);font-style:normal;white-space:nowrap;color:var(--ink)}
.c .bx{height:54px;border:1px solid var(--line);border-radius:8px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:500;color:var(--ink)}
.c .bx b{font-size:14px;font-weight:500}
.c.we .bx{background:var(--we)}
.c.today .bx{border:2px solid var(--accent)}
.c.dl .bx{background:var(--warn);color:var(--on-warn);border-color:transparent}
.c.dl .bx b{font-weight:700}
.c.after{opacity:.5}
.hero .strip{margin-top:2px}
.hero .c .mo{color:var(--hero-sub)}
.hero .c .bx{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.22);color:#fff}
.hero .c.we .bx{background:rgba(255,255,255,.14)}
.hero .c.today .bx{border:2px solid #93C5FD}
.hero .c.dl .bx{background:#FB923C;color:#0F172A;border-color:transparent}
.hero.late .c.dl .bx{background:#fff;color:#B91C1C}
.habit{display:flex;flex-direction:column;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 12px 12px 20px;min-height:68px;justify-content:center}
.habit.open{border:2px solid var(--accent)}
.habit .top{display:flex;align-items:center;gap:12px}
.habit .nm{flex:1;min-width:0;text-align:left;background:none;border:0;padding:0;font-size:19px;font-weight:700;overflow-wrap:anywhere}
.habit .nm small{display:block;font-size:14px;font-weight:500;color:var(--muted)}
.plus{width:48px;height:48px;border-radius:50%;border:2px solid var(--accent);background:transparent;color:var(--accent);display:inline-flex;align-items:center;justify-content:center;flex:none}
.amt{display:flex;gap:10px;align-items:center;padding-right:8px}
.field{flex:1;display:flex;align-items:center;gap:8px;height:52px;border:2px solid var(--ink);border-radius:14px;background:var(--card);padding:0 14px}
.field input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:22px;font-weight:700}
.field span{color:var(--muted);font-weight:500}
.rec{display:flex;align-items:baseline;justify-content:space-between;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 20px}
.rec .nm{font-size:20px;font-weight:600;overflow-wrap:anywhere}
.rec .v{font-size:44px;line-height:1;font-weight:700;letter-spacing:-.03em;color:var(--accent);font-variant-numeric:tabular-nums}
.rec .v small{font-size:17px;font-weight:600;color:var(--muted);letter-spacing:0;margin-left:8px}
textarea.cap{width:100%;height:150px;border:2px solid var(--ink);border-radius:20px;background:var(--card);padding:16px;font-size:18px;line-height:1.4;resize:none}
.back{display:inline-flex;align-items:center;gap:6px;min-height:44px;background:none;border:0;padding:0;font-weight:600;color:var(--accent);font-size:16px}
.done li{list-style:none;display:flex;align-items:center;gap:10px;color:var(--muted);font-weight:500;margin-bottom:8px}
.done{margin:0;padding:0}
.empty{color:var(--muted);font-size:16px;padding:6px 0}
.sortcard{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px;display:flex;flex-direction:column;gap:20px}
.sortcard .tx{font-size:26px;font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.acts{display:flex;flex-wrap:wrap;gap:10px}
#focus{position:fixed;inset:0;z-index:30;background:var(--hero);color:var(--on-hero);display:flex;flex-direction:column;padding:max(20px,env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) max(20px,env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
#focus.late{background:var(--late)}
#focus .tp{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
#focus .tp .icon{color:var(--on-hero)}
#focus .lab{font-size:15px;font-weight:600;color:var(--hero-sub);margin-top:10px}
#focus h2{font-size:clamp(26px,5vw,40px);line-height:1.15;margin-top:6px;letter-spacing:-.01em;overflow-wrap:anywhere}
#focus p{font-size:18px;line-height:1.5;color:var(--hero-sub);max-width:60ch;margin:12px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
#focus .mid{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
#focus .time{font-size:clamp(72px,24vw,220px);font-weight:700;letter-spacing:-.04em;opacity:.2;font-variant-numeric:tabular-nums;line-height:1}
#focus .bot{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:640px;width:100%;margin:0 auto}
#focus .bot button{min-height:64px;border-radius:99px;font-size:19px;font-weight:700}
#focus .hold{background:transparent;border:2px solid rgba(255,255,255,.7);color:#fff}
#focus .fin{background:#fff;border:0;color:#0F172A}
#modal{position:fixed;inset:0;z-index:40;background:rgba(5,10,25,.6);display:flex;align-items:center;justify-content:center;padding:16px}
.dlg{background:var(--card);color:var(--ink);border-radius:22px;padding:24px;width:100%;max-width:440px;max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:16px}
.dlg label{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:15px}
.dlg input,.dlg textarea{border:2px solid var(--line);border-radius:14px;background:var(--bg);padding:12px 14px;font-size:17px;font-weight:500;min-height:52px;width:100%}
.dlg textarea{min-height:96px;resize:vertical}
.dlg .acts{justify-content:flex-end}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(110px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:99px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
@media (min-width:820px){#toast{bottom:32px}}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>

<div class="app">
  <nav class="side" id="side" aria-label="Main"></nav>
  <main id="view" aria-live="polite"></main>
</div>
<nav class="tabbar" id="tabbar" aria-label="Main"></nav>
<div id="focus" hidden></div>
<div id="modal" hidden></div>
<div id="toast" role="status"></div>

<script>
(function(){
'use strict';
var COLS=['projects','tasks','habits','logs','box'];
var S={tab:'now',project:null,hview:'log',period:'month',open:null,sorting:false,draft:'',amount:'',
  data:{projects:{},tasks:{},habits:{},logs:{},box:{}},picks:{},loaded:{},ready:false,synced:null,dirty:false,focus:null,holdFired:false};
var dbns=null;
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var cl=function(o){return JSON.parse(JSON.stringify(o))};
var uid=function(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)};

/* dates */
var DAY=864e5,WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],MO=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function sod(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function today(){return sod(new Date())}
function parse(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function diff(a,b){return Math.round((b-a)/DAY)}
function fmt(d){return WD[d.getDay()]+' '+d.getDate()+' '+MO[d.getMonth()]}
function dlInfo(s){var d=diff(today(),parse(s));return d<0?{late:true,txt:(-d)+(d===-1?' day late':' days late')}:{late:false,txt:fmt(parse(s))}}

/* data */
function arr(c){return Object.keys(S.data[c]).map(function(id){var o=cl(S.data[c][id]);o.id=id;return o})}
function get(c,id){var v=S.data[c][id];if(!v)return null;var o=cl(v);o.id=id;return o}
function strip(o){var x=cl(o);delete x.id;return x}
function persistLocal(){if(dbns)return;try{localStorage.setItem('organizer.v1',JSON.stringify(S.data))}catch(e){}}
function loadLocal(){try{var r=localStorage.getItem('organizer.v1');if(r){var d=JSON.parse(r);COLS.forEach(function(c){S.data[c]=d[c]||{}})}}catch(e){}}
function save(c,o){var id=o.id||uid();var body=strip(o);S.data[c][id]=body;persistLocal();render();
  if(dbns)dbns.doc(c+'/'+id).set(body).catch(function(){toast('Could not save. Check your connection.')});return id}
function del(c,id){delete S.data[c][id];persistLocal();render();
  if(dbns)dbns.doc(c+'/'+id).delete().catch(function(){toast('Could not delete.')})}
var tt;function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('on')},2200)}

/* random picks, refreshed on every open */
function pick(list,key){var cur=S.picks[key];if(cur&&list.some(function(x){return x.id===cur}))return cur;
  var p=list[Math.floor(Math.random()*list.length)];S.picks[key]=p?p.id:null;return S.picks[key]}
function reshuffle(key){var m=S.picks._pool&&S.picks._pool[key]||[];var others=m.filter(function(x){return x!==S.picks[key]});
  var pool=others.length?others:m;S.picks[key]=pool[Math.floor(Math.random()*pool.length)];render()}
function poolPick(list,key){S.picks._pool=S.picks._pool||{};S.picks._pool[key]=list.map(function(x){return x.id});return pick(list,key)}
function nextStep(p){return (p.steps||[]).find(function(s){return !s.done})}
function projActive(p){return !(p.steps||[]).length||(p.steps||[]).some(function(s){return !s.done})}

/* icons */
var I={
 shuf:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/></svg>',
 plus:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
 back:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg>',
 chk:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg>',
 x:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>',
 now:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3" fill="currentColor"/></svg>',

/* day-by-day strip, week-by-week when the deadline is more than two months away */
function stripHtml(ds,trail){
  var t=today(),dl=parse(ds),n=diff(t,dl);if(n<0)return '';var h='',i,d,k;
  if(n<=60){
    var total=Math.max(n+(trail==null?14:trail),(trail==null?45:0));
    for(i=0;i<=total;i++){d=new Date(t.getFullYear(),t.getMonth(),t.getDate()+i);
      var cls='c'+(i===0?' today':'')+(d.getDay()===0||d.getDay()===6?' we':'')+(i===n?' dl':'')+(i>n?' after':'');
      h+='<div class="'+cls+'"><i class="mo">'+((d.getDate()===1||i===0)?MO[d.getMonth()]:'')+'</i><div class="bx">'+WD[d.getDay()].charAt(0)+'<b>'+d.getDate()+'</b></div></div>'}
  }else{
    var mon=function(x){var y=new Date(x.getFullYear(),x.getMonth(),x.getDate());y.setDate(y.getDate()-((y.getDay()+6)%7));return y};
    var w0=mon(t),w1=mon(dl),weeks=diff(w0,w1)/7+(trail==null?4:Math.min(trail,2));
    for(i=0;i<=weeks;i++){var ws=new Date(w0.getFullYear(),w0.getMonth(),w0.getDate()+7*i),we=new Date(ws.getFullYear(),ws.getMonth(),ws.getDate()+6);
      var has=dl>=ws&&dl<=we,isT=t>=ws&&t<=we;
      var c2='c w'+(isT?' today':'')+(has?' dl':'')+(ws>dl?' after':'');
      h+='<div class="'+c2+'"><i class="mo">'+((ws.getDate()<=7||i===0)?MO[ws.getMonth()]:'')+'</i><div class="bx">'+(has?WD[dl.getDay()].charAt(0):'M')+'<b>'+(has?dl.getDate():ws.getDate())+'</b></div></div>'}
  }
  return '<div class="strip" role="img" aria-label="Days until '+esc(fmt(dl))+'">'+h+'</div>';
}

function closeModal(){var m=$('#modal');m.hidden=true;m.innerHTML=''}
function mvals(){var m=$('#modal');return (m._cfg.fields||[]).map(function(_,i){return m.querySelector('#mf'+i).value.trim()})}

/* focus mode */
var ftimer=null;
function fmtTime(ms){var s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;
  return (h?h+':'+String(m).padStart(2,'0'):String(m).padStart(2,'0'))+':'+String(x).padStart(2,'0')}
function elapsed(){var f=S.focus;return f.acc+(f.paused?0:Date.now()-f.t0)}
function openFocus(kind,id,sid){
  var f={kind:kind,id:id,sid:sid,acc:0,t0:Date.now(),paused:false,title:'',label:'',desc:'',late:false};
  if(kind==='step'){var p=get('projects',id),s=(p.steps||[]).find(function(x){return x.id===sid});if(!s)return;f.title=s.title;f.desc=s.desc||'';f.label=p.name;f.late=!!(p.deadline&&dlInfo(p.deadline).late)}
  else if(kind==='task'){var t=get('tasks',id);if(!t)return;f.title=t.title;f.desc=t.desc||'';f.label=t.asap?'ASAP':''}
  else{var b=get('habits',id);if(!b)return;f.title=b.name;f.label=b.unit?b.unit:''}
  S.focus=f;drawFocus();clearInterval(ftimer);ftimer=setInterval(tick,500)}
function drawFocus(){var f=S.focus,el=$('#focus');el.hidden=false;el.className=f.late?'late':'';
  el.innerHTML='<div class="tp"><div><div class="lab">'+esc(f.label)+'</div><h2>'+esc(f.title)+'</h2>'+(f.desc?'<p>'+esc(f.desc)+'</p>':'')+'</div><button class="icon" data-act="f-close" aria-label="Leave">'+I.x+'</button></div>'+
  '<div class="mid"><div class="time" id="ftime" aria-hidden="true">'+fmtTime(elapsed())+'</div></div>'+
  '<div class="bot"><button class="hold" data-act="f-hold" id="fhold">'+(f.paused?'Resume':'Hold')+'</button><button class="fin" data-act="f-done">Done</button></div>'}
function tick(){if(!S.focus)return;var e=$('#ftime');if(e)e.textContent=fmtTime(elapsed())}
function closeFocus(){clearInterval(ftimer);S.focus=null;var el=$('#focus');el.hidden=true;el.innerHTML=''}
function finishFocus(){var f=S.focus;
  if(f.kind==='step'){var p=get('projects',f.id);p.steps.forEach(function(s){if(s.id===f.sid)s.done=true});save('projects',p);delete S.picks.proj}
  else if(f.kind==='task'){var t=get('tasks',f.id);t.done=true;save('tasks',t);delete S.picks.loose;delete S.picks.asap}
  else{var b=get('habits',f.id);closeFocus();if(b.unit){askAmount(b)}else logHabit(b,1);return}
  closeFocus();toast('Done');location.hash='now';S.tab='now';render()}
function askAmount(b){modal({title:b.name,fields:[{label:'How many '+b.unit+'?',type:'number',value:''}],buttons:[{label:'Cancel',kind:'quiet'},{label:'Log',needs0:true,on:function(v){logHabit(b,parseFloat(v[0].replace(',','.'))||0)}}]})}
function logHabit(b,amount){save('logs',{habitId:b.id,amount:amount,date:iso(today()),at:new Date().toISOString()});delete S.picks.habit;S.open=null;S.amount='';toast('Logged '+b.name);render()}

/* forms */
function taskForm(t,asapDefault){
  var edit=!!t;
  modal({title:edit?'Task':(asapDefault?'New ASAP task':'New task'),fields:[{label:'Title',value:edit?t.title:''},{label:'Description',multi:true,value:edit?(t.desc||''):''},{label:'Deadline',type:'date',value:edit?(t.deadline||''):''}],
    buttons:(edit?[{label:'Delete',kind:'danger',on:function(){del('tasks',t.id)}}]:[]).concat([{label:'Cancel',kind:'quiet'},{label:'Save',needs0:true,on:function(v){
      var o=edit?t:{asap:!!asapDefault,done:false,createdAt:new Date().toISOString()};o.title=v[0];o.desc=v[1];o.deadline=v[2]||null;save('tasks',o)}}])})}
function projectForm(p,prefill){
  var edit=!!p;
  modal({title:edit?'Project':'New project',fields:[{label:'Name',value:edit?p.name:(prefill||'')},{label:'Deadline',type:'date',value:edit?(p.deadline||''):''}],
    buttons:(edit?[{label:'Delete',kind:'danger',on:function(){S.project=null;del('projects',p.id)}}]:[]).concat([{label:'Cancel',kind:'quiet'},{label:'Save',needs0:true,on:function(v){
      var o=edit?p:{steps:[],createdAt:new Date().toISOString()};o.name=v[0];o.deadline=v[1]||null;var id=save('projects',o);if(!edit){S.picks={};S.project=id;S.tab='projects';location.hash='projects';render()}}}])})}
function stepForm(p,s){
  var edit=!!s;
  modal({title:edit?'Step':'New step',fields:[{label:'Title',value:edit?s.title:''},{label:'Description',multi:true,value:edit?(s.desc||''):''}],
    buttons:(edit?[{label:'Delete',kind:'danger',on:function(){p.steps=p.steps.filter(function(x){return x.id!==s.id});save('projects',p)}},{label:'Do next',kind:'ghost',on:function(v){var i=p.steps.findIndex(function(x){return x.id===s.id});var st=p.steps.splice(i,1)[0];st.title=v[0]||st.title;st.desc=v[1];var f=p.steps.findIndex(function(x){return !x.done});p.steps.splice(f<0?p.steps.length:f,0,st);save('projects',p)}}]:[]).concat([{label:'Cancel',kind:'quiet'},{label:'Save',needs0:true,on:function(v){
      if(edit){s.title=v[0];s.desc=v[1];p.steps=p.steps.map(function(x){return x.id===s.id?s:x})}else{p.steps=(p.steps||[]).concat([{id:uid(),title:v[0],desc:v[1],done:false}])}save('projects',p)}}])})}
function habitForm(b,prefill){
  var edit=!!b;
  modal({title:edit?'Habit':'New habit',fields:[{label:'Name',value:edit?b.name:(prefill||'')},{label:'Unit',ph:'Optional',value:edit?(b.unit||''):''}],
    buttons:(edit?[{label:'Delete',kind:'danger',on:function(){del('habits',b.id)}}]:[]).concat([{label:'Cancel',kind:'quiet'},{label:'Save',needs0:true,on:function(v){
      var o=edit?b:{createdAt:new Date().toISOString()};o.name=v[0];o.unit=v[1]||'';save('habits',o)}}])})}

/* events */
document.addEventListener('click',function(e){
  if(S.holdFired){S.holdFired=false;e.preventDefault();e.stopPropagation();return}
  var el=e.target.closest('[data-act]');if(!el)return;var a=el.dataset.act,id=el.dataset.id;
  switch(a){
  case 'shuf':reshuffle(el.dataset.k);break;
  case 'start':openFocus(el.dataset.kind,id,el.dataset.sid);break;
  case 'new-project':projectForm(null);break;
  case 'open-project':S.project=id;S.tab='projects';location.hash='projects';render();window.scrollTo(0,0);break;
  case 'back':S.project=null;render();break;
  case 'edit-project':projectForm(get('projects',S.project));break;
  case 'add-step':stepForm(get('projects',S.project),null);break;
  case 'edit-step':var p=get('projects',S.project),s=(p.steps||[]).find(function(x){return x.id===el.dataset.sid});if(s)stepForm(p,s);break;
  case 'add-task':taskForm(null,false);break;
  case 'add-asap':taskForm(null,true);break;
  case 'edit-task':taskForm(get('tasks',id),false);break;
  case 'task-done':var t=get('tasks',id);t.done=true;save('tasks',t);break;
  case 'hview':S.hview=el.dataset.v;render();break;
  case 'period':S.period=el.dataset.v;render();break;
  case 'add-habit':habitForm(null);break;
  case 'edit-habit':habitForm(get('habits',id));break;
  case 'habit-plus':var b=get('habits',id);if(b.unit){S.open=S.open===id?null:id;S.amount='';render()}else logHabit(b,1);break;
  case 'habit-log':var hb=get('habits',id),n=parseFloat(String(S.amount||'').replace(',','.'));if(!n){var inp=$('#amt');inp&&inp.focus();break}logHabit(hb,n);break;
  case 'drop':var v=S.draft.trim();if(!v)break;save('box',{text:v,at:new Date().toISOString()});S.draft='';toast('In the box');break;
  case 'box-del':del('box',id);break;
  case 'sort-start':S.sorting=true;render();break;
  case 'sort-end':S.sorting=false;render();break;
  case 'sort':sortItem(el.dataset.w,id);break;
  case 'f-close':closeFocus();break;
  case 'f-hold':var f=S.focus;if(f.paused){f.paused=false;f.t0=Date.now()}else{f.acc+=Date.now()-f.t0;f.paused=true}drawFocus();break;
  case 'f-done':finishFocus();break;
  case 'signin':fbAuth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(function(){toast('Sign-in failed')});break;
  case 'signout':fbAuth.signOut();break}
});
function sortItem(w,id){var c=get('box',id);if(!c)return;
  if(w==='task'||w==='asap'){save('tasks',{title:c.text,desc:'',deadline:null,asap:w==='asap',done:false,createdAt:new Date().toISOString()});del('box',id)}
  else if(w==='bin')del('box',id);
  else if(w==='skip'){c.at=new Date().toISOString();save('box',c)}
  else if(w==='project'){del('box',id);projectForm(null,c.text)}
  else if(w==='habit'){del('box',id);habitForm(null,c.text)}}
document.addEventListener('input',function(e){
  if(e.target.id==='cap')S.draft=e.target.value;
  if(e.target.id==='amt')S.amount=e.target.value});
document.addEventListener('focusout',function(){setTimeout(function(){if(S.dirty&&!(document.activeElement&&/INPUT|TEXTAREA/.test(document.activeElement.tagName)))render()},60)});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){if(!$('#modal').hidden)closeModal();else if(S.focus)closeFocus()}
  if(e.key==='Enter'&&e.target.id==='amt'){e.preventDefault();var b=document.querySelector('[data-act="habit-log"]');b&&b.click()}
  if((e.key==='a'||e.key==='A')&&!e.metaKey&&!e.ctrlKey&&e.target.closest&&e.target.closest('[data-hold]')&&!/INPUT|TEXTAREA/.test(e.target.tagName))askAsap(e.target.closest('[data-hold]').dataset.hold)});

/* hold to make a task ASAP */
var ht=null,hx=0,hy=0;
function askAsap(id){var t=get('tasks',id);if(!t||t.asap)return;confirmBox('Make it ASAP?',t.title,'Make ASAP',function(){t.asap=true;save('tasks',t)})}
document.addEventListener('pointerdown',function(e){var el=e.target.closest('[data-hold]');if(!el||el.classList.contains('asap'))return;hx=e.clientX;hy=e.clientY;
  clearTimeout(ht);ht=setTimeout(function(){S.holdFired=true;askAsap(el.dataset.hold)},650)});
['pointerup','pointercancel','pointerleave'].forEach(function(n){document.addEventListener(n,function(){clearTimeout(ht)},true)});
document.addEventListener('pointermove',function(e){if(ht&&(Math.abs(e.clientX-hx)>10||Math.abs(e.clientY-hy)>10))clearTimeout(ht)});
document.addEventListener('contextmenu',function(e){if(e.target.closest('[data-hold]'))e.preventDefault()});

/* start */
var fbAuth=null,unsubs=[];
route();
var FB=window.FIREBASE_CONFIG,configured=location.hostname!=='localhost'&&!!(FB&&FB.apiKey&&FB.apiKey.indexOf('PASTE')<0&&window.firebase);
function ready(){S.ready=true;render()}
function attach(uid,fs){
  var col=function(c){return fs.collection('users').doc(uid).collection(c)};
  dbns={collection:function(c){return {onSnapshot:function(ok,err){return col(c).onSnapshot(function(s){ok({docs:s.docs.map(function(d){return {id:d.id,data:function(){return d.data()}}})})},err)}}},
        doc:function(p){var a=p.split('/'),r=col(a[0]).doc(a[1]);return {set:function(b){return r.set(b)},delete:function(){return r.delete()}}}};
  var n=0;COLS.forEach(function(c){S.loaded[c]=0});
  COLS.forEach(function(c){unsubs.push(dbns.collection(c).onSnapshot(function(snap){var m={};snap.docs.forEach(function(d){m[d.id]=d.data()});S.data[c]=m;
    if(!S.loaded[c]){S.loaded[c]=1;if(++n===COLS.length)S.ready=true}render()},function(){if(!S.loaded[c]){S.loaded[c]=1;if(++n===COLS.length)S.ready=true}render()}))});
  setTimeout(function(){if(!S.ready){S.ready=true;render()}},4000)}
if(!configured){S.synced=false;loadLocal();ready()}
else{
  firebase.initializeApp(FB);fbAuth=firebase.auth();var fs=firebase.firestore();
  fs.enablePersistence({synchronizeTabs:true}).catch(function(){});
  S.synced=true;
  fbAuth.onAuthStateChanged(function(u){
    unsubs.forEach(function(f){f()});unsubs=[];S.user=u||null;S.ready=false;S.data={projects:{},tasks:{},habits:{},logs:{},box:{}};
    if(!u){dbns=null;S.signin=true;S.ready=true;render();return}
    S.signin=false;attach(u.uid,fs);render()});
}
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
})();
</script>
</body>
